# .github/workflows/k8s-sharding-tests.yml

name: Playwright Employee Form Tests (Headless K8s Sharding)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: digvijayanney
  IMAGE_NAME: flask-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-k8s-sharding:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: employee_db
          MYSQL_USER: emp_app
          MYSQL_PASSWORD: ""
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      
      flask-app:
        image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        env:
          DB_HOST: mysql
          DB_PORT: 3306
          DB_USER: emp_app
          DB_PASSWORD: ""
          DB_NAME: employee_db
          FLASK_SECRET_KEY: test-secret-key
        options: >-
          --health-cmd="curl -f http://localhost:5000/ || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 5000:5000
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
      
      - name: Wait for Flask app
        run: |
          echo "⏳ Waiting for Flask app at http://localhost:5000..."
          for i in {1..30}; do
            if curl -f http://localhost:5000/ 2>/dev/null; then
              echo "✅ Flask app is ready!"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          echo "❌ Flask app failed to start"
          exit 1
      
      - name: Setup database
        run: |
          echo "🗄️  Setting up database..."
          mysql -h 127.0.0.1 -u emp_app << 'MYSQL_EOF'
          CREATE TABLE IF NOT EXISTS employee_db.employees (
            employee_id VARCHAR(20) PRIMARY KEY,
            employee_name VARCHAR(100) NOT NULL,
            salary DECIMAL(12, 2) NOT NULL,
            designation VARCHAR(100) NOT NULL,
            city VARCHAR(100) NOT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          MYSQL_EOF
          echo "✅ Database ready"
      
      - name: Run Headless Tests (Shard ${{ matrix.shard }}/4)
        env:
          FLASK_URL: http://localhost:5000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: emp_app
          DB_PASSWORD: ""
          DB_NAME: employee_db
        run: |
          echo "🎭 Running Tests (Headless - Shard ${{ matrix.shard }}/4)"
          pytest tests/test_employee_crud.py \
            --shard=${{ matrix.shard }}/4 \
            -v \
            --tb=short \
            --json-report \
            --json-report-file=report_shard_${{ matrix.shard }}.json
          
          # Check if tests passed
          if [ $? -eq 0 ]; then
            echo "✅ Shard ${{ matrix.shard }}/4 - ALL TESTS PASSED"
          else
            echo "❌ Shard ${{ matrix.shard }}/4 - SOME TESTS FAILED"
            exit 1
          fi
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-shard-${{ matrix.shard }}
          path: report_shard_*.json
          retention-days: 7
  
  merge-results:
    needs: test-k8s-sharding
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Merge test results
        id: merge
        run: |
          python3 << 'EOF'
          import json
          import glob
          import sys
          
          all_tests = []
          all_failed = []
          
          # Find all report files
          for report_file in glob.glob('artifacts/**/report_shard_*.json', recursive=True):
              print(f"📄 Processing: {report_file}")
              try:
                  with open(report_file) as f:
                      data = json.load(f)
                      if 'tests' in data:
                          all_tests.extend(data['tests'])
                          all_failed.extend([t for t in data['tests'] if t['outcome'] == 'failed'])
              except json.JSONDecodeError as e:
                  print(f"⚠️  Error reading {report_file}: {e}")
          
          summary = {
              'total_tests': len(all_tests),
              'passed': len([t for t in all_tests if t['outcome'] == 'passed']),
              'failed': len([t for t in all_tests if t['outcome'] == 'failed']),
              'skipped': len([t for t in all_tests if t['outcome'] == 'skipped']),
              'failed_tests': [t['nodeid'] for t in all_failed]
          }
          
          print(f"\n{'='*70}")
          print(f"✅ TEST SUMMARY (HEADLESS - 4 PARALLEL SHARDS)")
          print(f"{'='*70}")
          print(f"Total Tests:   {summary['total_tests']}")
          print(f"✅ Passed:     {summary['passed']}")
          print(f"❌ Failed:     {summary['failed']}")
          print(f"⏭️  Skipped:    {summary['skipped']}")
          print(f"{'='*70}\n")
          
          if summary['failed'] > 0:
              print("❌ TESTS FAILED - PR CANNOT BE MERGED")
              print("\nFailed Tests (first 10):")
              for test in summary['failed_tests'][:10]:
                  print(f"  ❌ {test}")
              sys.exit(1)
          else:
              print("✅ ALL TESTS PASSED - PR CAN BE MERGED")
          
          with open('test_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          EOF
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = { total_tests: 0, passed: 0, failed: 0, skipped: 0 };
            try {
              summary = JSON.parse(fs.readFileSync('test_summary.json', 'utf-8'));
            } catch (e) {
              console.log('⚠️  Could not read summary');
            }
            
            const emoji = summary.failed === 0 ? '✅' : '❌';
            const status = summary.failed === 0 
              ? '**Status: READY TO MERGE** 🚀' 
              : '**Status: BLOCKED - FIX TESTS BEFORE MERGE** 🚫';
            
            const failedList = summary.failed_tests && summary.failed_tests.length > 0
              ? `**Failed Tests (first 10):**\n${summary.failed_tests.slice(0, 10).map(t => '- `' + t + '`').join('\n')}`
              : '✨ All tests passed!';
            
            const comment = `
            ${emoji} **Playwright Employee Form Tests (Headless K8s Sharding)**
            
            | Metric | Count |
            |--------|-------|
            | Total Tests | ${summary.total_tests} |
            | ✅ Passed | ${summary.passed} |
            | ❌ Failed | ${summary.failed} |
            | ⏭️ Skipped | ${summary.skipped} |
            
            **Execution:**
            - 4 parallel headless K8s pods (shards)
            - Duration: ~5-7 minutes
            
            ${status}
            
            ${failedList}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
