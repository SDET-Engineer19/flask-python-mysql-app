name: Playwright Employee Form Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: employee_db
          MYSQL_USER: emp_app
          MYSQL_PASSWORD: ""
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
      
      - name: Setup database
        run: |
          echo "🗄️ Setting up MySQL database..."
          mysql -h 127.0.0.1 -u root -proot_password << 'MYSQL_EOF'
          CREATE TABLE IF NOT EXISTS employee_db.employees (
            employee_id VARCHAR(20) PRIMARY KEY,
            employee_name VARCHAR(100) NOT NULL,
            salary DECIMAL(12, 2) NOT NULL,
            designation VARCHAR(100) NOT NULL,
            city VARCHAR(100) NOT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          MYSQL_EOF
          echo "✅ Database setup complete"
      
      - name: Start Flask app
        run: |
          echo "🚀 Starting Flask app..."
          python app.py > /tmp/flask.log 2>&1 &
          sleep 3
          if curl -f http://localhost:5000/ 2>/dev/null; then
            echo "✅ Flask app is running"
          else
            echo "❌ Flask app failed to start"
            cat /tmp/flask.log
            exit 1
          fi
      
      - name: Run Playwright tests
        env:
          FLASK_URL: http://localhost:5000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: emp_app
          DB_PASSWORD: ""
          DB_NAME: employee_db
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "🎭 Running Playwright tests..."
          pytest tests/testEmployeeForm.py -v --tb=short
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-*.json
            pytest-report.html
          retention-days: 7
